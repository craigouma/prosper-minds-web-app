<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Prosperminds">
  <title>Prosperminds</title>
  <!--
    Square browser mark, derived from the secondary/digital logo in the brand
    guide: the shield plus the neural-head motif, without the wordmark. The
    full horizontal logo (assets/images/fisrt-logo.png) is 713x183 and becomes
    unreadable squashed into a favicon square, which is why this exists.

    Shield is brand green #00BF63. The neural cluster is black, matching the
    logo. Node radii and stroke weights are deliberately heavier than the
    source artwork so the mark still resolves at 32px and stays a recognisable
    green shield even at 16px.
  -->
  <path fill="#00BF63"
        d="M32 3 L57 11.4 V31.5 C57 45.6 46.3 55.9 32 61 C17.7 55.9 7 45.6 7 31.5 V11.4 Z"/>

  <g stroke="#000" stroke-width="2.1" stroke-linecap="round" fill="none" opacity="0.92">
    <path d="M22 24 L31 19"/>
    <path d="M31 19 L41 25"/>
    <path d="M41 25 L38 35"/>
    <path d="M38 35 L27 38"/>
    <path d="M27 38 L22 24"/>
    <path d="M31 19 L27 38"/>
    <path d="M22 24 L38 35"/>
    <path d="M38 35 L34 46"/>
  </g>

  <g fill="#000">
    <circle cx="22" cy="24" r="3.4"/>
    <circle cx="31" cy="19" r="3.4"/>
    <circle cx="41" cy="25" r="3.4"/>
    <circle cx="38" cy="35" r="3.4"/>
    <circle cx="27" cy="38" r="3.4"/>
    <circle cx="34" cy="46" r="2.8"/>
  </g>
</svg>
